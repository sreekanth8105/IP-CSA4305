{% extends "base.html" %}{% block title %}Manage news{% endblock %}{% block content %}<section class="page-intro admin-intro"><span class="eyebrow">ANNOUNCEMENTS</span><h1>News & <em>updates.</em></h1><div class="admin-nav"><a href="{{ url_for('admin_dashboard') }}">Overview</a><a href="{{ url_for('admin_buses') }}">Buses</a><a href="{{ url_for('admin_categories') }}">Categories</a><a href="{{ url_for('admin_users') }}">Users</a><a href="{{ url_for('admin_comments') }}">Comments</a><a class="active" href="{{ url_for('admin_news') }}">News</a><a href="{{ url_for('admin_reports') }}">Reports</a></div></section><section class="admin-content"><form class="form-card" method="post"><h2>Publish news</h2><label>Title<input name="title" required></label><label>Announcement<textarea name="body" rows="4" required></textarea></label><button class="button" type="submit">Publish announcement</button></form></section><div class="news-page">{% for item in items %}<article class="news-article"><h2>{{ item.title }}</h2><p>{{ item.body }}</p><small>{{ item.created_at }}</small><form method="post" action="{{ url_for('delete_news',news_id=item.id) }}"><button class="link-button" type="submit">Delete</button></form></article>{% endfor %}</div>{% endblock %}
