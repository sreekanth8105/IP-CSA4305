{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-layout"><div class="auth-copy"><span class="eyebrow">YOUR NEXT TRIP IS CLOSER</span><h1>Let's get<br>you <em>going.</em></h1><p>Create an account to reserve seats and keep track of every booking.</p></div><form class="form-card" method="post"><span class="eyebrow">JOIN BUSWAY</span><h2>Create account</h2><label>Full name<input name="name" required autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>At least 8 characters.</small></label><button class="button full" type="submit">Create account →</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
