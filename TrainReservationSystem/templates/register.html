{% extends "base.html" %}{% block content %}<section class="auth"><div class="authintro"><span class="eyebrow">YOUR JOURNEY, YOUR ACCOUNT</span><h1>Let's get you <em>on board.</em></h1><p>Create an account to reserve tickets and keep your PNRs together.</p></div><form class="panel" method="post"><h2>Create account</h2><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required><small>At least 8 characters.</small></label><button class="btn">Create account</button><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
