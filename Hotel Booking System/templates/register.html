{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-aside"><span class="eyebrow">WELCOME TO YOUR NEXT STAY</span><h1>Good trips<br>start <em>here.</em></h1><p>Create an account to book rooms and keep all your reservations in one place.</p></div><form class="form-card" method="post"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><label>Full name<input name="name" required autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="button full" type="submit">Create account →</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
