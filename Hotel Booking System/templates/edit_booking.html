{% extends "base.html" %}{% block title %}Modify booking{% endblock %}
{% block content %}<section class="narrow"><span class="eyebrow">RESERVATION {{ booking.id }}</span><h1>Modify your <em>booking.</em></h1><p>Changes are permitted at least three days before arrival.</p><form class="form-card" method="post"><label>Check-in<input type="date" name="checkin" min="{{ today }}" value="{{ booking.checkin }}" required></label><label>Check-out<input type="date" name="checkout" min="{{ today }}" value="{{ booking.checkout }}" required></label><label>Guests<select name="guests">{% for n in range(1,13) %}<option value="{{ n }}" {% if booking.guests == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></label><button class="button full" type="submit">Save booking changes</button></form></section>{% endblock %}
