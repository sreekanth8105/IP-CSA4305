{% extends "base.html" %}{% block title %}Website content{% endblock %}
{% block content %}<section class="page-intro admin-intro"><span class="eyebrow">MANAGEMENT CONSOLE</span><h1>Website <em>content.</em></h1><p>Edit the information pages visible to customers.</p><div class="admin-nav"><a href="{{ url_for('admin_dashboard') }}">Overview</a><a href="{{ url_for('admin_rooms') }}">Manage rooms</a><a href="{{ url_for('admin_bookings') }}">Manage bookings</a><a class="active" href="{{ url_for('admin_info') }}">Website content</a></div></section><div class="info-admin-grid">{% for page in pages %}<form class="form-card" method="post"><input type="hidden" name="slug" value="{{ page.slug }}"><label>Page title<input name="title" value="{{ page.title }}" required></label><label>Content<textarea name="content" rows="6" required>{{ page.content }}</textarea></label><button class="button" type="submit">Save page</button></form>{% endfor %}</div>{% endblock %}
